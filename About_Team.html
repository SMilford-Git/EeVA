<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EeVA - The Ethical eValuation Agent</title>
<style>
    :root {
      --bg: #f5f7fb;
      --surface: rgba(255, 255, 255, 0.9);
      --text: #122033;
      --muted: #5f6e82;
      --line: #dbe3ef;
      --brand: #285ea8;
      --brand-dark: #173a68;
      --accent: #6db3ff;
      --shadow: 0 14px 40px rgba(15, 35, 63, 0.10);
      --radius: 22px;
      --max: 980px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(109, 179, 255, 0.25), transparent 30%),
        radial-gradient(circle at top right, rgba(40, 94, 168, 0.12), transparent 28%),
        linear-gradient(180deg, #f8fbff 0%, var(--bg) 100%);
      line-height: 1.75;
    }

    a { color: inherit; text-decoration: none; }
    .wrap {
      width: min(var(--max), calc(100% - 32px));
      margin: 0 auto;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(14px);
      background: rgba(245, 247, 251, 0.78);
      border-bottom: 1px solid rgba(219, 227, 239, 0.9);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      min-height: 78px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo {
      width: 54px;
      height: 54px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      color: white;
      font-weight: 800;
      font-size: 1.08rem;
      letter-spacing: 0.04em;
      background: linear-gradient(135deg, var(--brand) 0%, #4c8de2 60%, var(--accent) 100%);
      box-shadow: 0 10px 22px rgba(40, 94, 168, 0.25);
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 1.08rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin: 0;
      line-height: 1.15;
    }

    .brand-subtitle {
      margin: 2px 0 0;
      font-size: 0.92rem;
      color: var(--muted);
    }

    .nav {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: flex-end;
    }

    .nav a {
      padding: 10px 16px;
      border-radius: 999px;
      color: var(--brand-dark);
      font-weight: 600;
      transition: 0.2s ease;
    }

    .nav a:hover,
    .nav a:focus,
    .nav a.active {
      background: rgba(40, 94, 168, 0.10);
      color: var(--brand);
      outline: none;
    }

    main {
      padding: 42px 0 56px;
    }

    .page-card {
      background: var(--surface);
      border: 1px solid rgba(219, 227, 239, 0.95);
      box-shadow: var(--shadow);
      border-radius: var(--radius);
      padding: 44px 42px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(40, 94, 168, 0.09);
      color: var(--brand-dark);
      font-size: 0.84rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    h1 {
      margin: 18px 0 10px;
      font-size: clamp(2rem, 4vw, 3.2rem);
      line-height: 1.1;
      letter-spacing: -0.04em;
    }

    .intro {
      font-size: 1.12rem;
      color: var(--muted);
      margin-bottom: 24px;
    }

    h2 {
      margin-top: 28px;
      margin-bottom: 8px;
      font-size: 1.35rem;
      letter-spacing: -0.02em;
      color: var(--brand-dark);
    }

    p {
      margin: 0 0 18px;
      font-size: 1.03rem;
    }

    footer {
      border-top: 1px solid rgba(219, 227, 239, 0.95);
      color: var(--muted);
    }

    .footer-inner {
      min-height: 82px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .footer-note {
      font-size: 0.95rem;
    }

    @media (max-width: 720px) {
      .topbar {
        flex-direction: column;
        align-items: flex-start;
        padding: 14px 0;
      }

      .nav {
        justify-content: flex-start;
      }

      .page-card {
        padding: 30px 22px;
      }
    }
  </style>
</head>
<body>
    <header class="site-header">
    <div class="wrap topbar">
      <a class="brand" href="index.html" aria-label="EeVA home page">
        <div class="logo" aria-hidden="true">EeVA</div>
        <div>
          <p class="brand-title">EeVA</p>
          <p class="brand-subtitle">The Ethical eValuation Agent</p>
        </div>
      </a>

      <nav class="nav" aria-label="Main navigation">
        <a href="About_EeVA.html">About EeVA</a>
        <a href="Run_Evaluation.html">Run Evaluation</a>
        <a href="Retrieve_Evaluation.html">Retrieve Evaluation</a>
        <a href="About_Team.html">The Team</a>
      </nav>
    </div>
  </header>
	 
 <main class="wrap">
    <article class="page-card">
      <span class="eyebrow">The Team</span>
      <h1>Meet the Team</h1>
      <p class="intro">
       </p>
    </article>
  </main>

  <footer>
    <div class="wrap footer-inner">
      <div>© 2026 EeVA - The Ethical eValuation Agent</div>
      <div>Team page placeholder</div>
    </div>
  </footer>
</body>
</html>
